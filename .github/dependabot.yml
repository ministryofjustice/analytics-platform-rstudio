---
version: 2

updates:
  # Preserve daily update PRs without a seven-day release cooldown.
  - package-ecosystem: "github-actions" # zizmor: ignore[dependabot-cooldown]
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "devcontainers" # zizmor: ignore[dependabot-cooldown]
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker" # zizmor: ignore[dependabot-cooldown]
    directory: "/"
    schedule:
      interval: "daily"
